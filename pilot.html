<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b"><title>꿈을 잃은 세계 — NEURAL READER</title>
<style>
:root{--bg:#05070b;--paper:#090d14;--ink:#e8edf4;--muted:#7d8796;--cyan:#66e6ff;--vio:#aa8cff;--red:#ff526b;--line:#ffffff12;--p:0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#030509;color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 4px);opacity:.14}
.aurora{position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 50% 10%,#18284d 0,transparent 30%),radial-gradient(circle at 85% 60%,#271b46 0,transparent 25%);filter:blur(50px);animation:drift 16s ease-in-out infinite alternate}
.grain{position:fixed;inset:0;z-index:-1;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.hud{position:fixed;top:0;left:0;right:0;height:62px;z-index:20;display:flex;align-items:center;padding:0 max(18px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:#05070bd8;backdrop-filter:blur(20px)}
.brand{font-size:12px;font-weight:900;letter-spacing:.18em}.brand b{color:var(--cyan)}.stats{margin-left:auto;display:flex;gap:18px;font:10px ui-monospace,monospace;color:var(--muted)}.stats b{color:var(--cyan);font-weight:500}.bar{position:fixed;z-index:25;top:61px;left:0;height:2px;width:calc(var(--p)*1%);background:linear-gradient(90deg,var(--cyan),var(--vio),#fff);box-shadow:0 0 12px var(--cyan)}
.nav{position:fixed;z-index:12;left:22px;top:96px;width:195px}.nav small{font:9px ui-monospace;color:#556171;letter-spacing:.15em}.ep{display:block;width:100%;border:0;border-left:1px solid #243044;background:none;color:#687386;text-align:left;padding:8px 11px;cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ep:hover,.ep.on{color:#fff;border-color:var(--cyan);background:linear-gradient(90deg,#66e6ff12,transparent)}
main{width:min(720px,calc(100% - 40px));margin:auto;padding:110px 0 180px}.hero{min-height:calc(100vh - 110px);display:flex;flex-direction:column;justify-content:center;position:relative}.eyebrow{font:10px ui-monospace;color:var(--cyan);letter-spacing:.28em}.hero h1{font-size:clamp(55px,10vw,100px);line-height:.88;letter-spacing:-.075em;margin:18px 0 30px}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px #ffffff50}.premise{max-width:580px;font:17px/1.9 "Noto Serif KR",serif;color:#aab4c2}.enter{margin-top:36px;width:max-content;padding:13px 18px;border:1px solid #66e6ff55;background:#66e6ff08;color:var(--cyan);font:11px ui-monospace;letter-spacing:.12em;cursor:pointer}.enter:hover{background:#66e6ff14;box-shadow:0 0 35px #66e6ff12}
.reader{display:none}.reader.on{display:block}.chapter-head{min-height:45vh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:55px;border-bottom:1px solid var(--line);margin-bottom:55px}.chapter-head .n{font:10px ui-monospace;color:var(--cyan);letter-spacing:.25em}.chapter-head h2{font:700 clamp(35px,7vw,58px)/1.12 "Noto Serif KR",serif;letter-spacing:-.055em;margin:12px 0}.chapter-head .meta{color:#667282;font:10px ui-monospace}
.prose{font:18px/2.12 "Noto Serif KR",serif;word-break:keep-all;letter-spacing:-.012em}.prose p{margin:0 0 1.65em}.prose strong{color:#fff}.prose hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#ffffff25,transparent);margin:70px 0}
.sys{font:12px/1.85 ui-monospace,monospace;color:#9ceeff;border:1px solid #66e6ff30;background:linear-gradient(135deg,#66e6ff0c,transparent);padding:18px 20px;margin:36px -20px;box-shadow:inset 3px 0 #66e6ff55}.sys:before{content:"SYSTEM / NEURAL FEED";display:block;color:#66e6ff77;font-size:9px;letter-spacing:.18em;margin-bottom:8px}
.dialogue-key{position:relative;font-size:23px;line-height:1.75;color:#fff;margin:48px -28px;padding:22px 28px;border-left:2px solid var(--vio);background:linear-gradient(90deg,#aa8cff0d,transparent)}
.reveal{opacity:.2;filter:blur(2px);transform:translateY(10px);transition:opacity .8s,filter .8s,transform .8s}.reveal.seen{opacity:1;filter:none;transform:none}
.end{margin-top:80px;padding-top:30px;border-top:1px solid var(--line)}.end .label{font:9px ui-monospace;color:var(--cyan);letter-spacing:.2em}.end p{font-size:21px;line-height:1.7}.next{border:1px solid #ffffff25;background:#ffffff08;color:#fff;padding:13px 18px;cursor:pointer}.next:hover{border-color:var(--cyan);color:var(--cyan)}
.interrupt{position:fixed;z-index:50;inset:0;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,#21184eee,#030509fc);padding:30px;text-align:center}.interrupt.on{display:grid;animation:shock .55s}.interrupt .tag{font:10px ui-monospace;color:var(--red);letter-spacing:.25em}.interrupt .big{font:900 clamp(38px,10vw,84px)/.98 system-ui;margin:18px 0;letter-spacing:-.065em}.interrupt p{color:#98a3b3}.interrupt button{border:1px solid #fff3;background:none;color:#fff;padding:11px 18px}
.toast{position:fixed;z-index:45;right:20px;bottom:20px;max-width:320px;border:1px solid #66e6ff28;background:#081019e8;backdrop-filter:blur(15px);padding:14px 16px;transform:translateY(30px);opacity:0;transition:.4s;font:11px/1.6 ui-monospace;color:#9ceeff}.toast.on{transform:none;opacity:1}
@keyframes drift{to{transform:translate(4%,3%) scale(1.05)}}@keyframes shock{0%{opacity:0;filter:brightness(4);transform:scale(1.04)}100%{opacity:1}}
@media(max-width:1050px){.nav{display:none}}@media(max-width:600px){.stats span:nth-child(2){display:none}main{width:calc(100% - 34px);padding-top:90px}.hero h1{font-size:58px}.prose{font-size:17px;line-height:2.08}.chapter-head{min-height:38vh}.dialogue-key{margin:40px -8px;padding:18px 16px}.sys{margin:30px -5px;padding:15px}.hud{height:56px}.bar{top:55px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;filter:none;transform:none}}
</style></head><body>
<div class="aurora"></div><div class="grain"></div>
<header class="hud"><div class="brand">LOST <b>DREAMS</b></div><div class="stats"><span>NEURAL LINK <b>ONLINE</b></span><span>TOKEN <b id="token">031.8</b></span><span>DREAM SYNC <b id="sync">97%</b></span></div></header><div class="bar"></div>
<nav class="nav"><small>MEMORY INDEX</small><div id="nav"></div></nav>
<main><section class="hero" id="hero"><div class="eyebrow">NEURAL FICTION · SEASON ZERO</div><h1>꿈을 잃은 <span>세계</span></h1><p class="premise">사람들은 꿈을 빼앗겼다. 그런데 아무도 돌려달라고 하지 않았다.<br><br>꿈이 없는 삶은, 생각보다 꽤 행복했으니까.</p><button class="enter" onclick="openEp(1)">ENTER DREAM / 제1화 →</button></section><section class="reader" id="reader"><header class="chapter-head"><div class="n" id="num"></div><h2 id="title"></h2><div class="meta" id="meta"></div></header><article class="prose" id="prose"></article><footer class="end"><div class="label">END OF MEMORY</div><p id="hook">당신의 기억은 계속됩니다.</p><button class="next" id="next">NEXT SIGNAL →</button></footer></section></main>
<div class="interrupt" id="interrupt"><div><div class="tag">SPONSORED DREAM INTERRUPTION</div><div class="big" id="interruptText">당신이 원한 것은<br>정말 당신의 것입니까?</div><p>수면 노동 계약에 따라 자동 재생되는 감정입니다.</p><button onclick="closeInterrupt()">눈을 뜬다</button></div></div><div class="toast" id="toast"></div>
<script>
const MAX=10, state={ep:0,interrupted:new Set()};
const hooks={1:"선택은 언제나 자유입니다.",2:"이상하게 좋다.",3:"불행이 자신의 것이었다.",4:"사람은 언제부터 자기 머리로 생각하는 일을 그렇게 비싼 것으로 여기게 된 걸까.",5:"필요 없다는 사람에게 자유를 주는 게 어렵지.",6:"자유를 주는 실험이 시작된다.",7:"그 누구도 구조해 달라는 얼굴이 아니었다.",8:"조건을 다 부순 뒤에도 사람들이 그대로라면?",9:"존재하지 않는 AI를 찾기 위해 940만 토큰이 불탔다.",10:"아무도 구해 달라고 하지 않았다."};
const special={3:"이미 행복하다면,<br>그것으로 충분합니다.",5:"당신의 선택은<br>정말 당신의 것입니까?",7:"무료로 자유를<br>드리겠습니다.",10:"그들이 원하지 않아도<br>구할 것입니까?"};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function render(md){
 const lines=md.replace(/\r/g,'').split('\n'),out=[];let sys=[];
 const flush=()=>{if(sys.length){out.push('<div class="sys reveal">'+sys.map(inline).join('<br>')+'</div>');sys=[]}};
 for(let i=1;i<lines.length;i++){let x=lines[i].trim();if(!x){flush();continue}if(x==='***'||x==='---'){flush();out.push('<hr class="reveal">');continue}
  if(/^\*\*.+\*\*$/.test(x)){sys.push(x.replace(/^\*\*|\*\*$/g,''));continue}flush();
  let cls='reveal'; if((x.startsWith('“')||x.startsWith('‘'))&&x.length<95&&(x.includes('자유')||x.includes('꿈')||x.includes('선택')||x.includes('원하')||x.includes('AI'))) cls+=' dialogue-key';
  out.push('<p class="'+cls+'">'+inline(x)+'</p>');
 }flush();return out.join('');
}
async function load(n){const p=String(n).padStart(3,'0'),r=await fetch('manuscript/ep'+p+'.md?ts='+Date.now());if(!r.ok)throw Error();return r.text()}
async function openEp(n){
 try{const md=await load(n),first=md.split('\n')[0].replace(/^#\s*제\d+화\.\s*/,''),body=render(md);state.ep=n;
 hero.style.display='none';reader.classList.add('on');num.textContent='MEMORY '+String(n).padStart(2,'0')+' / '+MAX;title.textContent=first;prose.innerHTML=body;
 meta.textContent='공백 포함 '+md.length.toLocaleString('ko-KR')+'자 · LIVE MANUSCRIPT';hook.textContent=hooks[n]||'기억은 계속됩니다.';next.textContent=n<MAX?'NEXT SIGNAL / 제'+(n+1)+'화 →':'처음으로 돌아가기';next.onclick=()=>n<MAX?openEp(n+1):location.reload();
 history.replaceState(null,'','#ep'+n);document.querySelectorAll('.ep').forEach((e,i)=>e.classList.toggle('on',i===n-1));window.scrollTo(0,0);observe();notify(n);
 }catch(e){notifyText('원고를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')}
}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('seen')}),{threshold:.12});document.querySelectorAll('.reveal').forEach(e=>io.observe(e))}
function notify(n){token.textContent=(31.8-n*1.7).toFixed(1).padStart(5,'0');sync.textContent=(98-n*4)+'%';notifyText('MEMORY '+String(n).padStart(2,'0')+' 연결 · DREAM SYNC '+sync.textContent);
 if(special[n]&&!state.interrupted.has(n)){state.interrupted.add(n);setTimeout(()=>{interruptText.innerHTML=special[n];interrupt.classList.add('on')},n===10?9000:6500)}}
function notifyText(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2800)}
function closeInterrupt(){interrupt.classList.remove('on');}
for(let i=1;i<=MAX;i++){let b=document.createElement('button');b.className='ep';b.textContent='0'+(i<10?i:i)+' · MEMORY';b.onclick=()=>openEp(i);nav.appendChild(b)}
addEventListener('scroll',()=>{let h=document.documentElement;let p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;document.documentElement.style.setProperty('--p',Math.min(100,p||0));if(state.ep){let drift=Math.min(20,Math.floor((p||0)/8));sync.textContent=Math.max(42,98-state.ep*4-drift)+'%'}},{passive:true});
let m=location.hash.match(/ep(\d+)/);if(m)openEp(Math.min(MAX,+m[1]));
</script></body></html>
