name: 비주얼노벨 작동 검사

on:
  pull_request:
    paths:
      - 'vn/**'
      - 'tools/build-vn-offline.mjs'
      - 'tools/build-vn-public.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/vn-ui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 비주얼노벨 기능과 타이틀 메뉴 검사
        run: npm test --prefix vn
      - name: 데모 전용 공개 산출물 생성 검사
        run: node tools/build-vn-public.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lost-dreams-public"
