<linearGradient id="rightwall" x1="0" y1=".5" x2="1" y2=".4"><stop stop-color="#243744"/><stop offset=".6" stop-color="#101d29"/><stop offset="1" stop-color="#030b13"/></linearGradient>
<linearGradient id="floor" x1=".42" y1=".02" x2=".66" y2="1"><stop stop-color="#4a6670"/><stop offset=".25" stop-color="#1e333f"/><stop offset="1" stop-color="#0b141e"/></linearGradient>
<linearGradient id="panel" x1=".18" y1="0" x2=".8" y2="1"><stop stop-color="#7398a7"/><stop offset=".2" stop-color="#385665"/><stop offset=".55" stop-color="#1a3340"/><stop offset=".83" stop-color="#2a4551"/><stop offset="1" stop-color="#71919c"/></linearGradient>
<linearGradient id="panelSheen" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e4f4f0" stop-opacity=".28"/><stop offset=".2" stop-color="#95c8cf" stop-opacity=".075"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#c9e0e9" stop-opacity=".09"/></linearGradient>
<linearGradient id="coldbeam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cceaf7" stop-opacity=".38"/><stop offset="1" stop-color="#9de0ef" stop-opacity="0"/></linearGradient>
<linearGradient id="glaze" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#d0e3e4" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#8fc4cd" stop-opacity=".11"/></linearGradient>
