<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="넓고 차가운 상층 회의실, 한쪽 벽 전체가 빛나는 빈 정보 패널, 반사가 흐르는 바닥. 인물과 시스템 글자는 없다.">
<defs>
<linearGradient id="ceiling" x1=".4" y1="0" x2=".55" y2="1"><stop stop-color="#0a141f"/><stop offset=".7" stop-color="#243a4b"/><stop offset="1" stop-color="#425d69"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#091b2a"/><stop offset=".6" stop-color="#283e4c"/><stop offset="1" stop-color="#141f2c"/></linearGradient>
