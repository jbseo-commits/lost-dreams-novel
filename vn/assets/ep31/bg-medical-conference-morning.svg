<radialGradient id="vignette"><stop offset=".3" stop-color="#07121a" stop-opacity="0"/><stop offset="1" stop-color="#020810" stop-opacity=".6"/></radialGradient>
<filter id="fine"><feTurbulence type="fractalNoise" baseFrequency=".2" numOctaves="4" seed="12" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
