<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1822">
  <meta name="description" content="꿈을 잃은 세계 · 1~11화 무료 비주얼 노벨 데모">
  <title>꿈을 잃은 세계</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="neural-stage.css">
  <link rel="stylesheet" href="perception.css">
  <link rel="stylesheet" href="comfort.css">
  <link rel="stylesheet" href="episode-one.css?v=vn-all-events-20261023-r2">
  <link rel="stylesheet" href="episode-one-teaser.css">
  <link rel="stylesheet" href="core-demo.css?v=teaser-art-20261021-r1">
  <link rel="stylesheet" href="title-screen.css?v=parent-art-20261021-r2">
  <script src="story-data.js?v=teaser-art-20261021-r1"></script>
  <script type="module" src="app.js?v=vn-all-events-20261023-r2"></script>
</head>
<body>
  <main class="app-shell">
    <section class="title-screen" id="titleScreen" aria-label="타이틀 화면">
      <div class="title-art" aria-hidden="true"></div>
      <div class="title-logo-plate" aria-hidden="true"></div>
      <div class="title-aurora" aria-hidden="true"></div>
      <div class="title-mist" aria-hidden="true"></div>
      <div class="title-reflection" aria-hidden="true"></div>
      <canvas id="titleAtmosphere" class="title-atmosphere" aria-hidden="true"></canvas>
      <div class="title-corner-hud" aria-hidden="true"><span class="hud-pulse"></span>DREAM LINK <small>CONNECTED</small></div>
      <div class="title-content">
        <p class="eyebrow">LOST DREAMS <span>VISUAL NOVEL</span></p>
        <h1 id="storyTitle" class="title-accessible-heading">꿈을 잃은 세계</h1>
        <nav class="menu-actions" aria-label="메인 메뉴">
          <button type="button" class="menu-primary" id="startButton"><span>핵심 데모 시작</span><i aria-hidden="true"></i></button>
          <button type="button" id="continueButton"><span>이어하기</span><i aria-hidden="true"></i></button>
          <button type="button" id="demoButton"><span>정식판 출시 안내</span><i aria-hidden="true"></i></button>
          <button type="button" id="chaptersButton"><span>장 선택</span><i aria-hidden="true"></i></button>
          <button type="button" id="titleSaveButton"><span>저장과 백업</span><i aria-hidden="true"></i></button>
          <button type="button" id="settingsButton"><span>설정</span><i aria-hidden="true"></i></button>
          <button type="button" id="galleryButton"><span>갤러리</span><i aria-hidden="true"></i></button>
          <button type="button" id="creditsButton"><span>기록과 만든 이</span><i aria-hidden="true"></i></button>
        </nav>
        <p class="title-footnote" id="continueInfo" role="status" aria-live="polite">클릭 · Enter · Space로 읽기</p>
      </div>
      <footer class="title-footer"><span class="title-version">NEURAL DREAM / 01</span><span class="title-press">화면을 터치해 이야기를 시작하세요</span></footer>
    </section>

    <section class="game-screen" id="gameScreen" aria-label="이야기 화면" hidden>
      <div class="stage" id="stage">
        <div class="stage-image" id="stageImage"><div class="scene-layer active" id="sceneLayerA"></div><div class="scene-layer" id="sceneLayerB"></div></div>
        <div class="stage-vignette"></div>
        <div class="sensory-periphery" aria-hidden="true"><span>뉴럴피드</span></div>
        <header class="hud">
          <button class="icon-button home-button" id="homeButton" aria-label="타이틀 메뉴로">⌂</button>
          <div class="chapter-heading"><span id="chapterLabel">제1장</span><strong id="chapterTitle">제목</strong></div>
          <div class="progress-wrap" aria-label="읽기 진행"><span id="progressText">0 / 0</span><div class="progress-track"><i id="progressBar"></i></div></div>
          <button class="icon-button" id="backlogButton" aria-label="지난 이야기">☰</button>
          <button class="icon-button" id="saveButton" aria-label="저장 및 불러오기">▤</button>
          <button class="icon-button" id="gameSettingsButton" aria-label="설정">⚙</button>
          <button class="icon-button sound-toggle" id="soundToggle" aria-label="공간음 켜기" aria-pressed="false">♫</button>
          <button class="icon-button" id="hideUiButton" aria-label="화면 정보 숨기기" aria-pressed="false">◉</button>
        </header>

        <div class="place-ribbon" id="placeRibbon" hidden aria-live="polite"></div>
        <div class="motif-stage" id="motifStage" hidden aria-hidden="true"></div>
        <div class="cast-rail" id="castRail" hidden aria-label="장면 속 인물"></div>
        <button class="direction-card" id="directionCard" type="button" hidden></button>
        <button class="ui-reveal" id="uiReveal" type="button" aria-label="화면 인터페이스 다시 표시" hidden>정보 보기</button>

        <div class="ep1-stage" id="episodeOneStage" hidden></div>
        <div id="neuralStage" hidden></div>
        <div class="portrait-wrap" id="portraitWrap" aria-hidden="true"><img id="portraitImage" alt=""></div>
        <div class="portrait-wrap secondary" id="secondaryPortraitWrap" aria-hidden="true"><img id="secondaryPortraitImage" alt=""></div>
        <button class="advance-zone" id="advanceZone" aria-label="다음 문장"></button>

        <nav class="nav-tools" id="readingTools" aria-label="읽기 도구">
          <button id="previousButton" type="button" title="이전 문장 · ←">← 이전</button>
          <button id="autoToggle" type="button" aria-pressed="false" title="자동 진행 · A">자동</button>
          <button id="skipToggle" type="button" aria-pressed="false" title="읽은 문장만 넘기기 · K">읽은 곳 넘김</button>
          <button id="fullscreenButton" type="button" title="전체 화면 · F">전체 화면</button>
          <button id="helpButton" type="button" title="조작 도움말 · ?">도움말</button>
          <span class="tools-status" id="readingStatus" role="status" aria-live="polite">직접 읽기</span>
        </nav>
        <div class="story-box" id="storyBox" tabindex="0" aria-label="대화 영역. 다음 문장으로 진행">
          <div class="speaker" id="speaker"></div>
          <p class="story-text" id="storyText"></p>
          <div class="choice-area" id="choiceArea"></div>
          <span class="perception-advance" id="perceptionAdvance" hidden>계속 읽기</span>
          <span class="advance-indicator" id="advanceIndicator" aria-hidden="true">⌄</span>
        </div>
        <div class="keyboard-hint">← 이전　　→ 다음　　Space 진행</div>
        <div class="reading-announcement" id="readingAnnouncement" aria-live="polite" aria-atomic="true"></div>
      </div>
    </section>
  </main>
  <dialog id="modal" class="modal"><div class="modal-panel"><button class="modal-close" id="modalClose" aria-label="닫기">×</button><div id="modalContent"></div></div></dialog>
  <dialog id="episodeTeaser" class="episode-teaser" aria-label="꿈을 잃은 세계 티저 영상">
    <video id="teaserVideo" playsinline preload="none" aria-label="꿈을 잃은 세계 티저 V14"></video>
    <div class="teaser-controls">
      <p id="teaserStatus" role="status">티저 · 약 55초</p>
      <button id="teaserPause" type="button">일시 정지</button>
      <button id="teaserSkip" type="button" title="Esc로도 건너뛸 수 있습니다">영상 건너뛰기</button>
    </div>
  </dialog>
  <dialog id="titleGallery" class="title-gallery" aria-label="작품 갤러리">
    <div class="gallery-panel">
      <header><div><p class="gallery-kicker">LOST DREAMS</p><h2>작품 갤러리</h2></div><button type="button" id="galleryClose" aria-label="갤러리 닫기">×</button></header>
      <p class="gallery-intro">1화 연출에 사용된 장면 원화입니다. 무료 데모는 ‘핵심 데모 시작’에서 플레이할 수 있습니다.</p>
      <div class="gallery-grid">
        <figure><div class="gallery-art gallery-sea" role="img" aria-label="꿈속의 바다"></div><figcaption>01 · 빌린 바다</figcaption></figure>
        <figure><div class="gallery-art gallery-table" role="img" aria-label="서인의 식탁"></div><figcaption>02 · 아침의 식탁</figcaption></figure>
        <figure><div class="gallery-art gallery-clay" role="img" aria-label="점토 장면"></div><figcaption>03 · 손끝의 기억</figcaption></figure>
        <figure><div class="gallery-art gallery-night" role="img" aria-label="밤의 작은 집"></div><figcaption>04 · 밤의 집</figcaption></figure>
      </div>
    </div>
  </dialog>
  <script>
    (() => {
      const gallery = document.getElementById('titleGallery');
      const open = document.getElementById('galleryButton');
      const close = document.getElementById('galleryClose');
      open.addEventListener('click', () => {
        if (gallery.open) return;
        gallery.showModal();
        close.focus({ preventScroll: true });
      });
      close.addEventListener('click', () => gallery.close());
      gallery.addEventListener('click', (event) => { if (event.target === gallery) gallery.close(); });
      gallery.addEventListener('close', () => {
        if (!document.getElementById('titleScreen').hidden) open.focus({ preventScroll: true });
      });
    })();
  </script>
</body>
</html>
