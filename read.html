<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꿈을 잃은 세계</title>
<meta name="description" content="소설 「꿈을 잃은 세계」 읽기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ec;
  --surface: #fffdf8;
  --ink: #23212a;
  --muted: #7a7684;
  --line: #e4dfd4;
  --accent: #4b3fb8;
  --accent-soft: #ece9fb;
  --shadow: 0 12px 40px rgba(30, 25, 50, .14);
  --serif: 'Noto Serif KR', serif;
  --sans: 'Noto Sans KR', system-ui, sans-serif;
  --size: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111019;
    --surface: #1a1924;
    --ink: #e6e3ee;
    --muted: #9591a6;
    --line: #2b2938;
    --accent: #a99cff;
    --accent-soft: #262240;
    --shadow: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111019;
  --surface: #1a1924;
  --ink: #e6e3ee;
  --muted: #9591a6;
  --line: #2b2938;
  --accent: #a99cff;
  --accent-soft: #262240;
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
button { font: inherit; color: inherit; }

/* 상단 막대: 아래로 읽을 때는 숨고, 위로 올리면 다시 나온다 */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0;
  display: flex; align-items: center; gap: 8px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
  transition: transform .25s ease, border-color .25s;
}
.bar.scrolled { border-bottom-color: var(--line); }
.bar.away { transform: translateY(-100%); }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); }

.ep-btn {
  display: flex; align-items: center; gap: 8px; min-width: 0; max-width: min(70vw, 420px);
  height: 38px; padding: 0 10px 0 8px; border: 0; border-radius: 10px;
  background: none; cursor: pointer; text-align: left;
}
.ep-btn:hover, .ep-btn[aria-expanded="true"] { background: var(--accent-soft); }
.ep-btn .no { flex: none; font-weight: 700; font-size: 15px; }
.ep-btn .ttl { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 14px; }
.ep-btn svg { flex: none; color: var(--muted); transition: transform .2s; }
.ep-btn[aria-expanded="true"] svg { transform: rotate(180deg); }

.tools { margin-left: auto; display: flex; gap: 2px; }
.tool { width: 38px; height: 38px; border: 0; border-radius: 10px; background: none; cursor: pointer; font-size: 14px; color: var(--muted); }
.tool:hover { background: var(--accent-soft); color: var(--ink); }

/* 화 목록: 왼쪽 위 버튼에서 펼쳐진다. 닫혀 있을 때는 display:none */
.scrim { position: fixed; inset: 0; z-index: 35; display: none; background: rgba(10, 8, 20, .18); }
.menu {
  position: fixed; z-index: 40; display: none;
  top: calc(56px + env(safe-area-inset-top)); left: 10px;
  width: min(360px, calc(100vw - 20px)); max-height: min(70vh, 560px);
  flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  overflow: hidden; transform-origin: top left;
}
.open .scrim { display: block; }
.open .menu { display: flex; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(-4px); } }
.menu-head { padding: 14px 16px 10px; font-size: 12px; color: var(--muted); letter-spacing: .04em; border-bottom: 1px solid var(--line); }
.menu ol { list-style: none; margin: 0; padding: 6px; overflow-y: auto; overscroll-behavior: contain; }
.menu a {
  display: flex; gap: 12px; align-items: baseline; padding: 10px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.4;
}
.menu a:hover, .menu a:focus-visible { background: var(--accent-soft); outline: none; }
.menu a .n { flex: none; width: 2.6em; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.menu a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
.menu a[aria-current="page"] .n { color: var(--accent); }
.menu a.read:not([aria-current]) .t { color: var(--muted); }

/* 본문 */
main { max-width: 680px; margin: 0 auto; padding: calc(92px + env(safe-area-inset-top)) 22px 80px; }
.head { margin-bottom: 48px; }
.head .kicker { font-size: 13px; color: var(--accent); font-weight: 500; letter-spacing: .06em; }
.head h1 { margin: 10px 0 0; font-family: var(--serif); font-weight: 600; font-size: clamp(26px, 6vw, 34px); line-height: 1.35; word-break: keep-all; }
.prose { font-family: var(--serif); font-size: var(--size); line-height: 1.95; word-break: keep-all; overflow-wrap: break-word; }
.prose p { margin: 0 0 1.25em; }
.prose strong { font-weight: 600; }
.prose hr { border: 0; margin: 2.6em 0; text-align: center; }
.prose hr::before { content: '*  *  *'; color: var(--muted); letter-spacing: .3em; font-size: 14px; }
.state { color: var(--muted); text-align: center; padding: 80px 0; font-size: 15px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 64px; padding-top: 28px; border-top: 1px solid var(--line); }
.pager a {
  display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
  color: var(--ink); text-decoration: none; min-width: 0;
}
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pager span { display: block; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

@media (max-width: 480px) {
  .ep-btn .ttl { display: none; }
  main { padding-left: 20px; padding-right: 20px; }
}
@media (prefers-reduced-motion: reduce) { .bar, .ep-btn svg { transition: none; } .open .menu { animation: none; } }
</style>
</head>
<body>
<header class="bar" id="bar">
  <button class="ep-btn" id="epBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
    <span class="no" id="epNo">목차</span>
    <span class="ttl" id="epTtl"></span>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="tools">
    <button class="tool" id="smaller" aria-label="글자 작게">가−</button>
    <button class="tool" id="bigger" aria-label="글자 크게">가+</button>
    <button class="tool" id="theme" aria-label="밝기 바꾸기">◐</button>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="scrim" id="scrim"></div>
<nav class="menu" id="menu" aria-label="화 목록">
  <div class="menu-head">꿈을 잃은 세계 · 전체 <span id="total">…</span>화</div>
  <ol id="list"></ol>
</nav>

<main id="main">
  <div class="state">불러오는 중…</div>
</main>

<script>
// 꿈을 잃은 세계: 원고를 한 화씩 읽는 페이지. 주소 뒤 #3 은 제3화.
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem('ld-read:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('ld-read:' + k, v); } catch {} },
};
const pad = n => String(n).padStart(3, '0');
const epUrl = n => `manuscript/ep${pad(n)}.md`;
const titleOf = line => (line || '').replace(/^#\s*/, '').replace(/^제\d+화\.\s*/, '').trim();

let episodes = [];   // [{ n, title }]
let current = 0;
const cache = new Map();

// 목록: 배포 때 만들어지는 manifest.json을 먼저 쓰고, 없으면 원고 파일을 차례로 찾아본다.
async function loadList() {
  try {
    const r = await fetch('manifest.json', { cache: 'no-store' });
    if (r.ok) {
      const m = await r.json();
      const list = (m.manuscript || []).map(e => {
        const n = +(e.path.match(/ep(\d+)\.md$/) || [])[1];
        return n ? { n, title: titleOf(e.title) } : null;
      }).filter(Boolean);
      if (list.length) return list;
    }
  } catch {}
  const list = [];
  for (let start = 1; ; start += 10) {
    const batch = await Promise.all(Array.from({ length: 10 }, (_, i) => fetchEp(start + i).catch(() => null)));
    let done = false;
    batch.forEach((md, i) => {
      if (md == null) done = true;
      else if (!done) list.push({ n: start + i, title: titleOf(md.split('\n')[0]) });
    });
    if (done) return list;
  }
}

async function fetchEp(n) {
  if (cache.has(n)) return cache.get(n);
  const r = await fetch(epUrl(n), { cache: 'no-cache' });
  if (!r.ok) throw Error(r.status);
  const md = await r.text();
  cache.set(n, md);
  return md;
}

// 원고에 쓰이는 문법(문단, 줄바꿈, **굵게**, *기울임*, *** 구분선)만 다룬다.
function render(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  return md.replace(/\r/g, '').replace(/^#\s.*\n?/, '').split(/\n\s*\n/).map(block => {
    const b = block.trim();
    if (!b) return '';
    if (/^([*_-])(\s*\1){2,}$/.test(b)) return '<hr>';
    const lines = b.split('\n').map(l => inline(l.replace(/\s+$/, '')));
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

function buildMenu() {
  $('total').textContent = episodes.length;
  $('list').innerHTML = episodes.map(e =>
    `<li><a href="#${e.n}" data-n="${e.n}"><span class="n">${e.n}화</span><span class="t"></span></a></li>`).join('');
  $('list').querySelectorAll('a').forEach((a, i) => { a.querySelector('.t').textContent = episodes[i].title; });
}

function markMenu() {
  const readUpTo = +store.get('max') || 0;
  $('list').querySelectorAll('a').forEach(a => {
    const n = +a.dataset.n;
    if (n === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    a.classList.toggle('read', n <= readUpTo);
  });
}

function setMenu(open) {
  document.body.classList.toggle('open', open);
  $('epBtn').setAttribute('aria-expanded', open);
  if (open) {
    markMenu();
    const cur = $('list').querySelector('[aria-current]');
    if (cur) { cur.scrollIntoView({ block: 'center' }); cur.focus({ preventScroll: true }); }
  }
}

async function show(n) {
  const ep = episodes.find(e => e.n === n) || episodes[0];
  if (!ep) { $('main').innerHTML = '<div class="state">아직 올라온 원고가 없습니다.</div>'; return; }
  savePos();
  current = ep.n;
  $('epNo').textContent = `제${ep.n}화`;
  $('epTtl').textContent = ep.title;
  document.title = `제${ep.n}화 ${ep.title} · 꿈을 잃은 세계`;
  $('main').innerHTML = '<div class="state">불러오는 중…</div>';
  let md;
  try { md = await fetchEp(ep.n); }
  catch { $('main').innerHTML = '<div class="state">원고를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>'; return; }
  if (current !== ep.n) return;

  const i = episodes.indexOf(ep), prev = episodes[i - 1], next = episodes[i + 1];
  const link = (e, cls, label) => e ? `<a class="${cls}" href="#${e.n}"><small>${label}</small><span></span></a>` : '';
  $('main').innerHTML = `
    <header class="head"><div class="kicker">제${ep.n}화</div><h1></h1></header>
    <article class="prose">${render(md)}</article>
    <nav class="pager">${link(prev, 'prev', '← 이전 화')}${link(next, 'next', '다음 화 →')}</nav>`;
  $('main').querySelector('h1').textContent = ep.title;
  const spans = $('main').querySelectorAll('.pager span');
  [prev, next].filter(Boolean).forEach((e, k) => { spans[k].textContent = `${e.n}화 ${e.title}`; });

  store.set('last', ep.n);
  if (ep.n > (+store.get('max') || 0)) store.set('max', ep.n);
  const pos = +store.get('pos:' + ep.n) || 0;
  scrollTo(0, pos > 0.98 ? 0 : pos * docSpan());
  onScroll();
  if (next) fetchEp(next.n).catch(() => {});   // 다음 화 미리 받아 두기
}

// 읽던 위치 기억
const docSpan = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
function savePos() { if (current) store.set('pos:' + current, (scrollY / docSpan()).toFixed(4)); }

let lastY = 0, saveTimer;
function onScroll() {
  const y = scrollY;
  $('bar').classList.toggle('scrolled', y > 8);
  if (!document.body.classList.contains('open')) $('bar').classList.toggle('away', y > lastY && y > 120);
  lastY = y;
  $('progress').style.width = Math.min(100, y / docSpan() * 100) + '%';
  clearTimeout(saveTimer); saveTimer = setTimeout(savePos, 300);
}
addEventListener('scroll', onScroll, { passive: true });
addEventListener('pagehide', savePos);

function route() {
  setMenu(false);
  const n = +(location.hash.match(/^#(\d+)$/) || [])[1];
  show(n || +store.get('last') || 1);
}
addEventListener('hashchange', route);

$('epBtn').onclick = () => setMenu(!document.body.classList.contains('open'));
$('scrim').onclick = () => setMenu(false);
$('list').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (a && +a.dataset.n === current) { e.preventDefault(); setMenu(false); }
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('open')) { setMenu(false); $('epBtn').focus(); return; }
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = episodes.findIndex(x => x.n === current);
  if (e.key === 'ArrowLeft' && episodes[i - 1]) location.hash = episodes[i - 1].n;
  if (e.key === 'ArrowRight' && episodes[i + 1]) location.hash = episodes[i + 1].n;
});

// 글자 크기와 밝기
let size = +store.get('size') || 18;
const applySize = () => document.documentElement.style.setProperty('--size', size + 'px');
$('smaller').onclick = () => { size = Math.max(14, size - 1); store.set('size', size); applySize(); };
$('bigger').onclick = () => { size = Math.min(26, size + 1); store.set('size', size); applySize(); };
applySize();
const savedTheme = store.get('theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('theme', document.documentElement.dataset.theme);
};

(async () => {
  episodes = await loadList();
  buildMenu();
  route();
})();
</script>
</body>
</html>
